<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body bgcolor="#e0e0e0">

    <p>
        <a href="form1.html">Go to Page 1 (Login)</a> | 
        <b>Page 2: General Registration</b> | 
        <a href="form3.html">Go to Page 3 (Student Registration)</a>
    </p>
    <hr>

    <center>
        <h2><u>Registration form</u></h2>

        <form>
            <table cellpadding="6">
                <tr>
                    <td align="left">First Name</td>
                    <td><input type="text" size="30"></td>
                </tr>
                <tr>
                    <td align="left">Last Name</td>
                    <td><input type="text" size="30"></td>
                </tr>
                <tr>
                    <td align="left">Nick Name</td>
                    <td><input type="text" size="30"></td>
                </tr>
                <tr>
                    <td align="left">e-mail</td>
                    <td><input type="email" size="30"></td>
                </tr>
                <tr>
                    <td align="left">Password</td>
                    <td><input type="password" size="30"></td>
                </tr>
                <tr>
                    <td align="left">Date of Birth</td>
                    <td><input type="text" size="30"></td>
                </tr>
                <tr>
                    <td align="left">Gender</td>
                    <td>
                        <input type="radio" name="gen" id="male"><label for="male">Male</label>
                        <input type="radio" name="gen" id="female"><label for="female">Female</label>
                        <input type="radio" name="gen" id="others"><label for="others">Others</label>
                    </td>
                </tr>
                <tr>
                    <td align="left">Mobile</td>
                    <td><input type="text" size="30"></td>
                </tr>
                <tr>
                    <td align="left" valign="bottom">Address</td>
                    <td><textarea rows="5" cols="28"></textarea></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <br>
                        <input type="submit" value="submit">&nbsp;&nbsp;&nbsp;
                        <input type="reset" value="reset">
                    </td>
                </tr>
            </table>
        </form>
    </center>

</body>
</html>
