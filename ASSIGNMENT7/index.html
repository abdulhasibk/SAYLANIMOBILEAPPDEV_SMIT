<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            text-align: center;
            font-family: sans-serif;
            margin-top: 50px;
        }
        .box {
            width: 220px;
            border: 2px solid black;
            padding: 20px;
        }
        .box img {
            width: 60px;
        }
        .pink {
            background-color: #e91e63;
            color: white;
            border: none;
        }
        .btn {
            display: inline-block;
            background: black;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            margin-top: 15px;
        }
        .pink .btn {
            background: white;
            color: #e91e63;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="box">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png">
        <h3>TWITTER</h3>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
        <a href="#" class="btn">READ MORE</a>
    </div>

    <div class="box pink">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
        <h3>INSTAGRAM</h3>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
        <a href="#" class="btn">READ MORE</a>
    </div>

    <div class="box">
        <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
        <h3>YOUTUBE</h3>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
        <a href="#" class="btn">READ MORE</a>
    </div>
</div>

</body>
</html>
